services:
  transcribe:
    build:
      context: .
      args:
        MODEL: large-v3
    environment:
      # Weights are already in the image; refuse any network call for them, so
      # "nothing leaves the machine" is enforced rather than assumed.
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./audio:/audio
      - ./out:/out
      - models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - /audio/meeting.m4a
      - --model=large-v3
      - --languages=ru,en
      - --primary=ru
      - --out=/out/meeting

  # Same image, browser instead of a shell: docker compose up ui
  ui:
    build:
      context: .
      args:
        MODEL: large-v3
    environment:
      HF_HUB_OFFLINE: "1"
      # Must match the MODEL build arg: with downloads off, any other choice in
      # the dropdown would fail at load.
      STT_MODELS: "large-v3"
    volumes:
      - models:/models
    ports:
      - "7860:7860"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    entrypoint: ["python3", "app.py"]

volumes:
  models:
